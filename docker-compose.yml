version: '3.8'

services:
  go:
    image: golang:alpine
    container_name: go
    ports:
      - "8083:8083"
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    environment:
      # - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - CONFIG_PATH=.env
    depends_on:
      - db
  db:
    image: postgres
    container_name: db_go
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # - ./data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d